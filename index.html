<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f3ee">
  <title>재원 · 기본 포즈와 돌봄 동작</title>
  <link rel="preload" as="image" href="평범_느리게.gif">
  <link rel="preload" as="image" href="스테이션.jpg">
  <link rel="preload" as="image" href="식사.gif">
  <link rel="preload" as="image" href="샤워.gif">
  <link rel="stylesheet" href="jaewon-gif.css">
  <style>
    :root { color-scheme:light; color:#36443e; background:#f5f3ee; font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100svh; display:grid; place-items:center; padding:22px 14px; }
    main { width:min(100%,520px); }
    h1 { font-size:24px; margin:0 0 16px; font-weight:650; letter-spacing:-.05em; }
    .scene { position:relative; display:grid; grid-template-columns:minmax(0,1fr); place-items:center; width:min(100%,462px); margin-inline:auto; border-radius:28px; background:#fff url('스테이션.jpg') center/100% 100% no-repeat; overflow:hidden; box-shadow:0 8px 35px #53654c08; }
    .scene[data-pose="showering"] { background-image:none; }
    .controls { display:flex; gap:9px; margin-top:16px; }
    .controls button { flex:1; min-height:46px; border:1px solid #dce2d9; border-radius:12px; padding:11px 14px; color:#43594e; background:#fff; font:inherit; font-size:14px; cursor:pointer; }
    .controls button.primary { background:#526f5e; border-color:#526f5e; color:#fff; }
    button:focus-visible { outline:3px solid #80a990; outline-offset:3px; }
    .note { color:#788379; text-align:center; font-size:13px; line-height:1.7; margin:14px 4px 0; }
    .status { min-height:22px; text-align:center; color:#526f5e; font-size:14px; margin-top:12px; }
  </style>
</head>
<body>
  <main>
    <h1>재원</h1>
    <section class="scene" data-pose="normal" aria-label="재원 캐릭터 미리보기">
      <div id="jaewon"></div>
    </section>
    <div class="status" id="status" aria-live="polite">평소 모습</div>
    <div class="controls" aria-label="재원 행동">
      <button type="button" class="primary" id="eat">식사하기</button>
      <button type="button" id="shower">샤워하기</button>
      <button type="button" id="normal">평소 포즈</button>
    </div>
    <p class="note">평소 모습과 식사는 스테이션 배경에서 재생됩니다. 샤워는 약 5초 뒤 평소 모습으로 돌아옵니다.</p>
  </main>
  <script src="jaewon-gif.js"></script>
  <script>
    const jaewon = new JaewonGif('#jaewon');
    const status = document.getElementById('status');
    document.getElementById('eat').addEventListener('click', () => jaewon.eat());
    document.getElementById('shower').addEventListener('click', () => jaewon.shower());
    document.getElementById('normal').addEventListener('click', () => jaewon.setPose('normal'));
    document.getElementById('jaewon').addEventListener('jaewonposechange', event => {
      document.querySelector('.scene').dataset.pose = event.detail.pose;
      status.textContent = event.detail.pose === 'eating' ? '식사 중'
        : event.detail.pose === 'showering' ? '샤워 중' : '평소 모습';
      document.getElementById('eat').disabled = event.detail.pose !== 'normal';
      document.getElementById('shower').disabled = event.detail.pose !== 'normal';
    });
  </script>
</body>
</html>
